services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tukio
      POSTGRES_PASSWORD: tukio_local_password
      POSTGRES_DB: tukio
    ports:
      - '5432:5432'
    volumes:
      - tukio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tukio -d tukio']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tukio-postgres:
